# Server Configuration
server.port=8080
# No context-path - serve frontend at root, API at /api

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/vvel_universe
# Disable auto-index-creation to avoid conflicts with existing Node.js indexes
spring.data.mongodb.auto-index-creation=false

# JWT Configuration
jwt.secret=VvelUniverseSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS512Algorithm
jwt.expiration=86400000
# 24 hours in milliseconds

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Logging
logging.level.com.vveluniverse=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO

# Application
spring.application.name=VvelUniverse Backend

