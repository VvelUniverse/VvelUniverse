<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vvel Universe | Call Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #020617 0%, #0f172a 50%, #1f2937 100%);
      color: white;
      display: flex;
      flex-direction: column;
    }

    .call-container {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .meeting-header {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background: rgba(15, 23, 42, 0.75);
      border-radius: 18px;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 80px rgba(15, 23, 42, 0.55);
    }

    .meeting-title {
      font-size: 1.75rem;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .meeting-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.95rem;
      color: rgba(226, 232, 240, 0.75);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.08em;
      background: rgba(59, 130, 246, 0.2);
      color: #bfdbfe;
    }

    .call-stage {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .media-tile {
      position: relative;
      background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.35), transparent 55%),
                  rgba(17, 24, 39, 0.9);
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      min-height: 260px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 35px rgba(15, 23, 42, 0.5);
    }

    .media-label {
      position: absolute;
      top: 1rem;
      left: 1rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .media-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      opacity: 0.85;
    }

    .control-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 1rem;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
    }

    .control-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-button {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(30, 41, 59, 0.75);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.45);
    }

    .control-button:hover {
      transform: translateY(-2px);
      border-color: rgba(148, 163, 184, 0.45);
    }

    .control-button.danger {
      background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
      border: none;
      width: 96px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      gap: 0.5rem;
      padding: 0 1rem;
    }

    .control-button.off {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .details-panel {
      background: rgba(15, 23, 42, 0.78);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 1.5rem;
      display: grid;
      gap: 1rem;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .detail-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.9rem;
    }

    .detail-label {
      color: rgba(226, 232, 240, 0.6);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .detail-value {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .alert-box {
      background: rgba(248, 113, 113, 0.18);
      border: 1px solid rgba(252, 165, 165, 0.35);
      border-radius: 12px;
      padding: 1rem;
      font-size: 0.95rem;
      color: #fecaca;
      display: none;
    }

    .mode-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      background: rgba(45, 212, 191, 0.15);
      color: #5eead4;
      border: 1px solid rgba(45, 212, 191, 0.35);
    }

    @media (max-width: 768px) {
      .call-container {
        padding: 1.5rem 1rem 6.5rem;
      }

      .meeting-title {
        font-size: 1.4rem;
      }

      .control-button {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>
<body>
  <div class="call-container">
    <div class="meeting-header">
      <div class="meeting-title">
        <i data-lucide="sparkles" class="w-6 h-6 text-indigo-300"></i>
        <span id="meetingTitle">Connecting to session...</span>
      </div>
      <div class="meeting-meta">
        <div class="badge" id="modeBadge">
          <i data-lucide="video" class="w-4 h-4"></i>
          Video
        </div>
        <div class="tag">
          <i data-lucide="user" class="w-4 h-4"></i>
          <span id="hostName">Host</span>
        </div>
        <div class="tag">
          <i data-lucide="hash" class="w-4 h-4"></i>
          Code: <span id="meetingCode">—</span>
        </div>
        <div class="tag">
          <i data-lucide="clock" class="w-4 h-4"></i>
          Starts <span id="startTimeText">soon</span>
        </div>
      </div>
      <div id="alertBox" class="alert-box"></div>
    </div>

    <div class="call-stage">
      <div class="media-tile" id="remoteFeed">
        <div class="media-label">
          <i data-lucide="broadcast" class="w-4 h-4"></i>
          Live Speaker
        </div>
        <div class="media-placeholder" id="remotePlaceholder">🙏</div>
      </div>
      <div class="media-tile" id="localFeed">
        <div class="media-label">
          <i data-lucide="user" class="w-4 h-4"></i>
          You
        </div>
        <div class="media-placeholder" id="localPlaceholder">🧘</div>
      </div>
    </div>

    <div class="details-panel">
      <div class="details-grid">
        <div class="detail-item">
          <div class="detail-label">Session Starts</div>
          <div class="detail-value" id="sessionStartDetail">—</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Duration</div>
          <div class="detail-value" id="sessionDurationDetail">—</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Access Mode</div>
          <div class="detail-value" id="sessionModeDetail">Video</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Direct Link</div>
          <div class="detail-value" style="font-size: 0.9rem; word-break: break-all;" id="sessionLinkDetail">—</div>
        </div>
      </div>
      <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
        <button class="button neutral" onclick="copyMeetingCode()">
          <i data-lucide="clipboard" class="w-4 h-4"></i>
          Copy Meeting Code
        </button>
        <button class="button neutral" onclick="toggleMode()">
          <i data-lucide="repeat" class="w-4 h-4"></i>
          Switch Mode
        </button>
      </div>
    </div>
  </div>

  <div class="control-bar">
    <div class="control-group">
      <button class="control-button" id="micToggle" onclick="toggleControl('mic')">
        <i data-lucide="mic" class="w-6 h-6"></i>
      </button>
      <button class="control-button" id="cameraToggle" onclick="toggleControl('camera')">
        <i data-lucide="video" class="w-6 h-6"></i>
      </button>
      <button class="control-button" id="audioToggle" onclick="toggleControl('audio')">
        <i data-lucide="volume-2" class="w-6 h-6"></i>
      </button>
      <button class="control-button" onclick="toggleControl('screen')">
        <i data-lucide="monitor-up" class="w-6 h-6"></i>
      </button>
      <button class="control-button danger" onclick="endCall()">
        <i data-lucide="phone-off" class="w-5 h-5"></i>
        Leave
      </button>
    </div>
  </div>

  <script src="app-state.js"></script>
  <script>
    lucide.createIcons();

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('sessionId');
    let currentMode = (params.get('mode') || 'video').toLowerCase();
    const sessionRecord = sessionId ? vvelAppState.getSession(sessionId) : null;
    const joinRequest = sessionId && typeof vvelAppState.getJoinRequest === 'function'
      ? vvelAppState.getJoinRequest(sessionId)
      : null;
    const meetingDetails = sessionRecord?.meetingDetails || joinRequest?.meetingDetails || null;

    const state = {
      mic: true,
      camera: currentMode === 'video',
      audio: true,
      screen: false
    };

    const modeBadge = document.getElementById('modeBadge');
    const meetingTitle = document.getElementById('meetingTitle');
    const hostName = document.getElementById('hostName');
    const meetingCode = document.getElementById('meetingCode');
    const startTimeText = document.getElementById('startTimeText');
    const alertBox = document.getElementById('alertBox');
    const sessionStartDetail = document.getElementById('sessionStartDetail');
    const sessionDurationDetail = document.getElementById('sessionDurationDetail');
    const sessionModeDetail = document.getElementById('sessionModeDetail');
    const sessionLinkDetail = document.getElementById('sessionLinkDetail');

    if (!sessionId || !meetingDetails) {
      alertBox.style.display = 'block';
      alertBox.textContent = 'We could not find any meeting details for this session. Ensure the request is approved and payment completed.';
      meetingTitle.textContent = 'Session Not Ready';
      modeBadge.style.display = 'none';
    } else {
      hydrateMeetingInfo();
    }

    function hydrateMeetingInfo() {
      meetingTitle.textContent = meetingDetails.sessionTitle || 'Community Session';
      hostName.textContent = meetingDetails.hostName || 'Host';
      meetingCode.textContent = meetingDetails.meetingCode || '—';
      sessionModeDetail.textContent = currentMode === 'audio' ? 'Audio Only' : 'Video & Audio';
      sessionLinkDetail.textContent = meetingDetails.joinUrl || window.location.href;

      const scheduledStart = meetingDetails.scheduledStart
        ? new Date(meetingDetails.scheduledStart)
        : new Date();
      const relativeStart = meetingDetails.startsIn || formatRelativeTime(scheduledStart.getTime());
      startTimeText.textContent = relativeStart.replace(/^in /, '');
      sessionStartDetail.textContent = scheduledStart.toLocaleString(undefined, {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
      sessionDurationDetail.textContent = `${meetingDetails.durationMinutes || 30} minutes`;

      updateModeBadge();
    }

    function updateModeBadge() {
      const icon = currentMode === 'audio' ? 'audio-lines' : 'video';
      modeBadge.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i>${currentMode === 'audio' ? 'Audio' : 'Video'}`;
      lucide.createIcons();
    }

    function toggleMode() {
      currentMode = currentMode === 'audio' ? 'video' : 'audio';
      state.camera = currentMode === 'video';
      updateModeBadge();
      sessionModeDetail.textContent = currentMode === 'audio' ? 'Audio Only' : 'Video & Audio';
      const localTile = document.getElementById('localPlaceholder');
      localTile.textContent = currentMode === 'audio' ? '🎧' : '🧘';
      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('mode', currentMode);
      window.history.replaceState({}, '', newUrl.toString());
    }

    function copyMeetingCode() {
      const code = meetingCode.textContent.trim();
      if (!code || code === '—') {
        alert('Meeting code is not available yet.');
        return;
      }
      navigator.clipboard?.writeText(code)
        .then(() => alert('Meeting code copied to clipboard.'))
        .catch(() => alert(`Meeting code: ${code}`));
    }

    function toggleControl(control) {
      state[control] = !state[control];
      const buttonId = control === 'audio' ? 'audioToggle' : `${control}Toggle`;
      const button = document.getElementById(buttonId);
      if (button) {
        button.classList.toggle('off', !state[control]);
      }
    }

    function endCall() {
      if (confirm('Leave the call?')) {
        window.location.href = 'community.html';
      }
    }

    function formatRelativeTime(timestamp) {
      const date = typeof timestamp === 'number' ? new Date(timestamp) : new Date(timestamp);
      if (Number.isNaN(date.getTime())) {
        return 'Just now';
      }
      const diff = date.getTime() - Date.now();
      const absDiff = Math.abs(diff);
      const ranges = [
        { limit: 60 * 1000, divisor: 1000, unit: 'second' },
        { limit: 60 * 60 * 1000, divisor: 60 * 1000, unit: 'minute' },
        { limit: 24 * 60 * 60 * 1000, divisor: 60 * 60 * 1000, unit: 'hour' },
        { limit: 7 * 24 * 60 * 60 * 1000, divisor: 24 * 60 * 60 * 1000, unit: 'day' },
        { limit: 30 * 24 * 60 * 60 * 1000, divisor: 7 * 24 * 60 * 60 * 1000, unit: 'week' },
        { limit: 365 * 24 * 60 * 60 * 1000, divisor: 30 * 24 * 60 * 60 * 1000, unit: 'month' }
      ];
      let unit = 'year';
      let divisor = 365 * 24 * 60 * 60 * 1000;
      for (const range of ranges) {
        if (absDiff < range.limit) {
          unit = range.unit;
          divisor = range.divisor;
          break;
        }
      }
      const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
      return rtf.format(Math.round(diff / divisor), unit);
    }
  </script>
</body>
</html>
