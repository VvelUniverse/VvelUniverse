<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vvel Universe | My Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/styles/loading-styles.css">
  <style>
    :root {
      --navy-100: #0b1a3a;
      --navy-200: #0f2a5a;
      --navy-300: #123571;
      --navy-400: #174ea6;
      --glass-bg: rgba(13, 31, 74, 0.26);
      --glass-blur: blur(18px);
      --glass-border: 1.4px solid rgba(23, 78, 166, 0.55);
      --panel-shadow: 0 20px 50px rgba(3, 10, 24, 0.55);
      --title-color: #ffffff;
      --body-color: #e5e7eb;
      --muted-color: #c7c9d4;
      --font-title: 'Orbitron', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: var(--body-color);
      font-family: var(--font-body);
      min-height: 100vh;
      background-image:
        url('/assets/images/space-bg.jpg'),
        url('Space-bg.png'),
        url('Space-bg.jpeg'),
        url('/assets/images/space-bg.jpg'),
        url('space-bg.png'),
        url('space-bg.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(1200px 900px at 20% 20%, rgba(0,0,0,0.35), transparent 55%),
                  linear-gradient(180deg, rgba(0,0,0,0.42), rgba(0,0,0,0.55));
      pointer-events: none;
      z-index: 0;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      padding: 2rem clamp(1rem, 4vw, 3rem);
      max-width: 1200px;
      margin: 0 auto;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: var(--glass-border);
      box-shadow: var(--panel-shadow);
      border-radius: 18px;
      padding: 1.5rem;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
    }

    .profile-photo-container {
      position: relative;
      margin-bottom: 1rem;
    }

    .profile-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: transform 0.3s ease;
      overflow: hidden;
      object-fit: cover;
    }

    .profile-photo:hover {
      transform: scale(1.05);
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .edit-photo-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: var(--glass-border);
      backdrop-filter: var(--glass-blur);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .edit-photo-btn:hover {
      background: rgba(59, 130, 246, 0.3);
      transform: scale(1.1);
    }

    .profile-name {
      font-family: var(--font-title);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--title-color);
      margin-bottom: 0.5rem;
    }

    .profile-email {
      color: var(--muted-color);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
      width: 100%;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--title-color);
      margin-bottom: 0.25rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--muted-color);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-title {
      font-family: var(--font-title);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--title-color);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .edit-btn {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .edit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .info-label {
      color: var(--muted-color);
      font-size: 0.9rem;
    }

    .info-value {
      color: var(--title-color);
      font-weight: 600;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--glass-bg);
      border: var(--glass-border);
      border-radius: 18px;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      backdrop-filter: var(--glass-blur);
      box-shadow: var(--panel-shadow);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-family: var(--font-title);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--title-color);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--muted-color);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      color: var(--muted-color);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(23, 78, 166, 0.35);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: rgba(23, 78, 166, 0.85);
      box-shadow: 0 0 0 4px rgba(23, 78, 166, 0.25);
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .file-input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-input-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      border: 2px dashed rgba(23, 78, 166, 0.5);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-input-label:hover {
      border-color: rgba(23, 78, 166, 0.8);
      background: rgba(255, 255, 255, 0.08);
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: var(--glass-border);
      color: var(--title-color);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: var(--glass-blur);
      transition: all 0.3s ease;
      z-index: 10000;
      box-shadow: 0 8px 24px rgba(3, 10, 24, 0.4);
    }

    .back-btn:hover {
      background: rgba(59, 130, 246, 0.2);
      transform: scale(1.1);
      box-shadow: 0 12px 32px rgba(23, 78, 166, 0.5);
    }

    .back-btn:active {
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .profile-header {
        margin-bottom: 1.5rem;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .back-btn {
        top: 12px;
        left: 16px;
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <a href="/pages/categories/categories.html" class="back-btn" aria-label="Back">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </a>

  <div class="content-wrapper">
    <!-- Profile Header -->
    <div class="glass-card profile-header">
      <div class="profile-photo-container">
        <div class="profile-photo" id="profilePhoto" onclick="triggerPhotoUpload()">
          <span id="profilePhotoInitial">👤</span>
        </div>
        <div class="edit-photo-btn" onclick="triggerPhotoUpload()">
          <i data-lucide="camera" class="w-4 h-4"></i>
        </div>
        <input type="file" id="photoUpload" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
      </div>
      <h1 class="profile-name" id="profileName">Loading...</h1>
      <p class="profile-email" id="profileEmail">Loading...</p>
      <button class="edit-btn" onclick="openEditModal()">
        <i data-lucide="edit-2" class="w-4 h-4"></i>
        Edit Profile
      </button>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="connectionsCount">0</div>
        <div class="stat-label">Connections</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="followersCount">0</div>
        <div class="stat-label">Followers</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="requestsCount">0</div>
        <div class="stat-label">Requests</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="postsCount">0</div>
        <div class="stat-label">Posts</div>
      </div>
    </div>

    <!-- User Details -->
    <div class="glass-card" style="margin-bottom: 1.5rem;">
      <h2 class="section-title">
        <i data-lucide="user" class="w-5 h-5"></i>
        Personal Information
      </h2>
      <div class="info-item">
        <span class="info-label">Full Name</span>
        <span class="info-value" id="displayName">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Email</span>
        <span class="info-value" id="displayEmail">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Mobile Number</span>
        <span class="info-value" id="displayMobile">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Account Type</span>
        <span class="info-value" id="displayAccountType">-</span>
      </div>
      <div class="info-item">
        <span class="info-label">Member Since</span>
        <span class="info-value" id="displayMemberSince">-</span>
      </div>
    </div>

    <!-- Bio Section -->
    <div class="glass-card" style="margin-bottom: 1.5rem;">
      <h2 class="section-title">
        <i data-lucide="file-text" class="w-5 h-5"></i>
        Bio
      </h2>
      <p id="displayBio" style="color: var(--muted-color); line-height: 1.6;">
        No bio added yet. Click "Edit Profile" to add one.
      </p>
    </div>

    <!-- Recent Activity -->
    <div class="glass-card">
      <h2 class="section-title">
        <i data-lucide="activity" class="w-5 h-5"></i>
        Recent Activity
      </h2>
      <div id="recentActivity" style="color: var(--muted-color);">
        <p>No recent activity to display.</p>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div id="editModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Edit Profile</h2>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="editProfileForm" onsubmit="event.preventDefault(); handleProfileUpdate();">
        <div class="form-group">
          <label class="form-label" for="editName">Full Name</label>
          <input type="text" id="editName" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="editMobile">Mobile Number</label>
          <input type="tel" id="editMobile" class="form-input" />
        </div>
        <div class="form-group">
          <label class="form-label" for="editBio">Bio</label>
          <textarea id="editBio" class="form-input form-textarea" placeholder="Tell us about yourself..." maxlength="500"></textarea>
          <div style="text-align: right; color: var(--muted-color); font-size: 12px; margin-top: 4px;">
            <span id="bioCharCount">0</span> / 500
          </div>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button type="submit" class="edit-btn" style="flex: 1; margin: 0;">
            <i data-lucide="save" class="w-4 h-4"></i>
            Save Changes
          </button>
          <button type="button" class="edit-btn" style="flex: 1; margin: 0; background: rgba(239, 68, 68, 0.3);" onclick="closeEditModal()">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/scripts/common/loading-utils.js"></script>
  <script>
    lucide.createIcons();

    let currentUser = null;
    let profileData = {
      connections: 0,
      followers: 0,
      requests: 0,
      posts: 0,
      bio: ''
    };

    // Check authentication and load profile
    async function initProfile() {
      try {
        showLoadingOverlay('Loading profile...');
        
        const response = await fetch('/api/auth/status', {
          credentials: 'include'
        });
        const data = await response.json();

        if (!data.success || !data.authenticated) {
          window.location.href = '/index.html';
          return;
        }

        currentUser = data.user;
        await loadProfileData();
        hideLoadingOverlay();
      } catch (error) {
        console.error('Profile init error:', error);
        hideLoadingOverlay();
        alert('Failed to load profile. Please try again.');
      }
    }

    // Load profile data from backend
    async function loadProfileData() {
      try {
        // Load user profile
        const profileResponse = await fetch('/api/profile', {
          credentials: 'include'
        });

        if (profileResponse.ok) {
          const profile = await profileResponse.json();
          if (profile.success) {
            profileData = profile.data;
            currentUser = { ...currentUser, ...profile.data };
          }
        }

        // Load stats
        const statsResponse = await fetch('/api/profile/stats', {
          credentials: 'include'
        });

        if (statsResponse.ok) {
          const stats = await statsResponse.json();
          if (stats.success) {
            profileData.connections = stats.data.connections || 0;
            profileData.followers = stats.data.followers || 0;
            profileData.requests = stats.data.requests || 0;
            profileData.posts = stats.data.posts || 0;
          }
        }

        renderProfile();
      } catch (error) {
        console.error('Load profile error:', error);
        // Use default data if API fails
        renderProfile();
      }
    }

    // Render profile data
    function renderProfile() {
      if (!currentUser) return;

      // Basic info
      document.getElementById('profileName').textContent = currentUser.name || 'User';
      document.getElementById('profileEmail').textContent = currentUser.email || '';
      document.getElementById('displayName').textContent = currentUser.name || '-';
      document.getElementById('displayEmail').textContent = currentUser.email || '-';
      document.getElementById('displayMobile').textContent = currentUser.mobile || '-';
      document.getElementById('displayAccountType').textContent = (currentUser.accountType === 'client' ? 'Client' : 'User') || 'User';
      
      // Member since
      if (currentUser.createdAt) {
        const date = new Date(currentUser.createdAt);
        document.getElementById('displayMemberSince').textContent = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
      } else {
        document.getElementById('displayMemberSince').textContent = '-';
      }

      // Profile photo
      if (currentUser.profilePhoto) {
        const photoEl = document.getElementById('profilePhoto');
        photoEl.innerHTML = `<img src="${currentUser.profilePhoto}" alt="Profile Photo">`;
      } else {
        const initial = (currentUser.name || 'U').charAt(0).toUpperCase();
        document.getElementById('profilePhotoInitial').textContent = initial;
      }

      // Bio
      if (profileData.bio) {
        document.getElementById('displayBio').textContent = profileData.bio;
      }

      // Stats
      document.getElementById('connectionsCount').textContent = profileData.connections;
      document.getElementById('followersCount').textContent = profileData.followers;
      document.getElementById('requestsCount').textContent = profileData.requests;
      document.getElementById('postsCount').textContent = profileData.posts;

      // Update edit form
      document.getElementById('editName').value = currentUser.name || '';
      document.getElementById('editMobile').value = currentUser.mobile || '';
      document.getElementById('editBio').value = profileData.bio || '';
      updateBioCharCount();
    }

    // Photo upload
    function triggerPhotoUpload() {
      document.getElementById('photoUpload').click();
    }

    async function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Validate file
      if (file.size > 5 * 1024 * 1024) {
        alert('Image size must be less than 5MB');
        return;
      }

      if (!file.type.startsWith('image/')) {
        alert('Please select an image file');
        return;
      }

      try {
        showLoadingOverlay('Uploading photo...');
        
        const formData = new FormData();
        formData.append('photo', file);

        const response = await fetch('/api/profile/photo', {
          method: 'POST',
          credentials: 'include',
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Update photo display
          const photoEl = document.getElementById('profilePhoto');
          photoEl.innerHTML = `<img src="${data.data.profilePhoto}" alt="Profile Photo">`;
          currentUser.profilePhoto = data.data.profilePhoto;
          alert('Profile photo updated successfully!');
        } else {
          alert(data.message || 'Failed to upload photo');
        }
      } catch (error) {
        console.error('Photo upload error:', error);
        alert('Failed to upload photo. Please try again.');
      } finally {
        hideLoadingOverlay();
      }
    }

    // Edit modal
    function openEditModal() {
      document.getElementById('editModal').classList.add('show');
      lucide.createIcons();
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('show');
    }

    // Bio character count
    function updateBioCharCount() {
      const bio = document.getElementById('editBio').value;
      document.getElementById('bioCharCount').textContent = bio.length;
    }

    document.getElementById('editBio').addEventListener('input', updateBioCharCount);

    // Update profile
    async function handleProfileUpdate() {
      const name = document.getElementById('editName').value.trim();
      const mobile = document.getElementById('editMobile').value.trim();
      const bio = document.getElementById('editBio').value.trim();

      if (!name) {
        alert('Name is required');
        return;
      }

      try {
        showLoadingOverlay('Updating profile...');

        const response = await fetch('/api/profile', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({
            name,
            mobile,
            bio
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          currentUser.name = name;
          currentUser.mobile = mobile;
          profileData.bio = bio;
          renderProfile();
          closeEditModal();
          alert('Profile updated successfully!');
        } else {
          alert(data.message || 'Failed to update profile');
        }
      } catch (error) {
        console.error('Update profile error:', error);
        alert('Failed to update profile. Please try again.');
      } finally {
        hideLoadingOverlay();
      }
    }

    // Close modal on outside click
    document.getElementById('editModal').addEventListener('click', (e) => {
      if (e.target.id === 'editModal') {
        closeEditModal();
      }
    });

    // Initialize
    initProfile();
  </script>
</body>
</html>
