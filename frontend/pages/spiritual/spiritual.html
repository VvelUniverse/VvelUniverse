<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vvel Universe | Spiritual</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --navy-100: #0b1a3a;
      --navy-200: #0f2a5a;
      --navy-300: #123571;
      --navy-400: #174ea6;
      --glass-bg: rgba(13, 31, 74, 0.26);
      --glass-blur: blur(18px);
      --glass-border: 1.4px solid rgba(23, 78, 166, 0.55);
      --panel-shadow: 0 20px 50px rgba(3, 10, 24, 0.55);
      --title-color: #ffffff;
      --body-color: #e5e7eb;
      --muted-color: #c7c9d4;
      --button-bg: linear-gradient(90deg, #0f2a5a 0%, #123571 55%, #174ea6 100%);
      --button-shadow: 0 12px 26px rgba(23, 78, 166, 0.45);
      --font-title: 'Orbitron', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --font-body: 'Outfit', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: var(--body-color);
      font-family: var(--font-body);
      min-height: 100vh;
      background-image:
        url('/assets/images/space-bg.jpg'),
        url('Space-bg.png'),
        url('Space-bg.jpeg'),
        url('/assets/images/space-bg.jpg'),
        url('space-bg.png'),
        url('space-bg.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(1200px 900px at 20% 20%, rgba(0,0,0,0.35), transparent 55%),
                  linear-gradient(180deg, rgba(0,0,0,0.42), rgba(0,0,0,0.55));
      pointer-events: none;
      z-index: 0;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2rem clamp(1rem, 4vw, 3rem);
    }

    /* Glass morphism card styling - Tailwind compatible */
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.4px solid rgba(23, 78, 166, 0.55);
      box-shadow: 0 20px 50px rgba(3, 10, 24, 0.55);
    }

    .card-hover {
      transition: all 0.3s ease;
    }

    .card-hover:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 30px rgba(96, 165, 250, 0.45);
      border-color: rgba(34, 211, 238, 0.8);
    }

    .card-hover:active {
      transform: translateY(-2px) scale(1.01);
    }

    .glass-card.selected {
      border-color: rgba(34, 211, 238, 0.8);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.18), 0 0 25px 8px rgba(96, 165, 250, 0.35);
    }

    /* Title styling */
    .title-text {
      font-family: var(--font-title);
      color: var(--title-color);
      letter-spacing: 0.02em;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="content-wrapper">
    <!-- Header Section -->
    <header class="text-center mb-8">
      <h1 class="title-text text-4xl md:text-5xl lg:text-6xl mb-3">
        Choose Your Spiritual Path
      </h1>
      <p class="text-[#c7c9d4] text-base md:text-lg max-w-2xl mx-auto">
        Select your spiritual tradition to explore deeper wisdom and connection
      </p>
    </header>

    <!-- Cards Grid -->
    <main class="flex-1 flex items-center justify-center">
      <div class="flex flex-wrap justify-center items-center gap-4 max-w-6xl w-full">
        
        <!-- Christianity Card -->
        <div 
          class="glass-card rounded-xl p-4 cursor-pointer card-hover w-[140px]"
          onclick="selectReligion('Christianity')"
          role="button"
          tabindex="0"
          onkeydown="if(event.key === 'Enter') selectReligion('Christianity')"
        >
          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-12 flex items-center justify-center">
              <i data-lucide="cross" class="w-12 h-12 text-white"></i>
            </div>
            <h3 class="text-white font-bold text-sm text-center">Christianity</h3>
          </div>
        </div>

        <!-- Islam Card -->
        <div 
          class="glass-card rounded-xl p-4 cursor-pointer card-hover w-[140px]"
          onclick="selectReligion('Islam')"
          role="button"
          tabindex="0"
          onkeydown="if(event.key === 'Enter') selectReligion('Islam')"
        >
          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-12 flex items-center justify-center">
              <i data-lucide="moon" class="w-12 h-12 text-white"></i>
            </div>
            <h3 class="text-white font-bold text-sm text-center">Islam</h3>
          </div>
        </div>

        <!-- Hinduism Card -->
        <div 
          class="glass-card rounded-xl p-4 cursor-pointer card-hover w-[140px]"
          onclick="selectReligion('Hinduism')"
          role="button"
          tabindex="0"
          onkeydown="if(event.key === 'Enter') selectReligion('Hinduism')"
        >
          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-12 flex items-center justify-center">
              <i data-lucide="sun" class="w-12 h-12 text-white"></i>
            </div>
            <h3 class="text-white font-bold text-sm text-center">Hinduism</h3>
          </div>
        </div>

        <!-- Buddhism Card -->
        <div 
          class="glass-card rounded-xl p-4 cursor-pointer card-hover w-[140px]"
          onclick="selectReligion('Buddhism')"
          role="button"
          tabindex="0"
          onkeydown="if(event.key === 'Enter') selectReligion('Buddhism')"
        >
          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-12 flex items-center justify-center">
              <i data-lucide="circle-dot" class="w-12 h-12 text-white"></i>
            </div>
            <h3 class="text-white font-bold text-sm text-center">Buddhism</h3>
          </div>
        </div>

        <!-- Judaism Card -->
        <div 
          class="glass-card rounded-xl p-4 cursor-pointer card-hover w-[140px]"
          onclick="selectReligion('Judaism')"
          role="button"
          tabindex="0"
          onkeydown="if(event.key === 'Enter') selectReligion('Judaism')"
        >
          <div class="flex flex-col items-center gap-2">
            <div class="w-12 h-12 flex items-center justify-center">
              <i data-lucide="sparkles" class="w-12 h-12 text-white"></i>
            </div>
            <h3 class="text-white font-bold text-sm text-center">Judaism</h3>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Function to handle religion selection - redirects directly
    function selectReligion(religion) {
      // Store selection in localStorage
      localStorage.setItem('selectedReligion', religion);
      
      // Navigate to respective page based on religion
      // You can customize these URLs to point to specific pages for each religion
      const religionPages = {
        'Christianity': 'christianity.html',
        'Islam': 'islam.html',
        'Hinduism': 'hinduism.html',
        'Buddhism': 'buddhism.html',
        'Judaism': 'judaism.html'
      };
      
      // Redirect to the religion-specific page, or fallback to categories
      const redirectUrl = religionPages[religion] || 'categories.html';
      window.location.href = redirectUrl;
    }

    // Handle keyboard navigation
    document.addEventListener('DOMContentLoaded', function() {
      const cards = document.querySelectorAll('[role="button"]');
      cards.forEach(card => {
        card.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
          }
        });
      });
    });
  </script>
</body>
</html>
