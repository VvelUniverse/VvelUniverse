<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vvel Universe | Sports</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --navy-100: #0b1a3a;
      --navy-200: #0f2a5a;
      --navy-300: #123571;
      --navy-400: #174ea6;
      --glass-bg: rgba(13, 31, 74, 0.26);
      --glass-border: 1.4px solid rgba(23, 78, 166, 0.55);
      --panel-shadow: 0 20px 50px rgba(3, 10, 24, 0.55);
      --title-color: #ffffff;
      --body-color: #e5e7eb;
      --muted-color: #c7c9d4;
      --font-title: 'Orbitron', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: var(--body-color);
      font-family: var(--font-body);
      min-height: 100vh;
      background-image:
        url('Space-bg.jpg'),
        url('Space-bg.png'),
        url('Space-bg.jpeg'),
        url('space-bg.jpg'),
        url('space-bg.png'),
        url('space-bg.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(1200px 900px at 20% 20%, rgba(0,0,0,0.35), transparent 55%),
                  linear-gradient(180deg, rgba(0,0,0,0.42), rgba(0,0,0,0.55));
      pointer-events: none;
      z-index: 0;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2rem clamp(1rem, 4vw, 3rem);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: var(--glass-border);
      box-shadow: var(--panel-shadow);
    }

    .card-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .card-hover:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 18px 40px rgba(96, 165, 250, 0.45);
      border-color: rgba(34, 211, 238, 0.8);
    }

    .card-hover:active {
      transform: translateY(-2px) scale(1.01);
    }

    .title-text {
      font-family: var(--font-title);
      color: var(--title-color);
      letter-spacing: 0.02em;
      font-weight: 800;
    }

    .badge {
      background: linear-gradient(120deg, rgba(14, 165, 233, 0.4), rgba(59, 130, 246, 0.4));
      border: 1px solid rgba(59, 130, 246, 0.5);
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #e0f2fe;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="content-wrapper">
    <header class="text-center mb-10 space-y-3">
      <div class="badge inline-flex items-center gap-2 uppercase tracking-widest">
        <i data-lucide="trophy" class="w-4 h-4"></i>
        Sports Universe
      </div>
      <h1 class="title-text text-4xl md:text-6xl">Explore the Sports Universe</h1>
      <p class="text-[#c7c9d4] text-base md:text-lg max-w-2xl mx-auto">
        Choose your arena and dive into curated highlights, stories, and communities for every type of sport.
      </p>
    </header>

    <main class="flex-1 flex justify-center">
      <section class="grid gap-5 sm:gap-6 md:gap-8"
        style="grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); max-width: 960px; width: 100%;">
      </section>
    </main>
  </div>


  <script>
    const categories = [
      { key: 'ball-sports', name: 'Ball Sports', icon: 'dribbble', highlight: 'From football to basketball' },
      { key: 'track-sports', name: 'Track Sports', icon: 'flag', highlight: 'Speed, stamina, records' },
      { key: 'stick-sports', name: 'Stick Sports', icon: 'goal', highlight: 'Precision and teamwork' },
      { key: 'water-sports', name: 'Water Sports', icon: 'waves', highlight: 'Aquatic thrills and skills' },
      { key: 'motor-sports', name: 'Motor Sports', icon: 'gauge', highlight: 'Engines, speed, adrenaline' },
      { key: 'gymnastics', name: 'Gymnastics', icon: 'sparkles', highlight: 'Power meets artistry' },
      { key: 'ice-sports', name: 'Ice Sports', icon: 'snowflake', highlight: 'Glide, spin, and score' },
      { key: 'animal-sports', name: 'Animal Sports', icon: 'paw-print', highlight: 'Human & animal synergy' },
      { key: 'contact-team-sport', name: 'Contact Team Sport', icon: 'shield', highlight: 'High impact teamwork' },
      { key: 'other-sports', name: 'Other Sports', icon: 'more-horizontal', highlight: 'Discover unique sports' }
    ];

    function renderCards() {
      const grid = document.querySelector('main section');
      categories.forEach(category => {
        const card = document.createElement('article');
        card.className = 'glass-card card-hover rounded-2xl p-6 flex flex-col gap-4 cursor-pointer';
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', category.name);
        card.addEventListener('click', () => openCategory(category.key));
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openCategory(category.key);
          }
        });

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center">
              <i data-lucide="${category.icon}" class="w-7 h-7 text-white"></i>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-white/70"></i>
          </div>
          <div>
            <h2 class="text-xl font-bold text-white mb-1">${category.name}</h2>
            <p class="text-sm text-white/70 leading-relaxed">${category.highlight}</p>
          </div>
          <div class="flex items-center gap-2 text-xs text-sky-200/80 uppercase tracking-wide">
            <i data-lucide="sparkle" class="w-4 h-4"></i>
            Tap to explore
          </div>
        `;

        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    function openCategory(key) {
      const routes = {
        'ball-sports': 'Category/Sub-Category/Sports/Sports/sports-ball-sports.html',
        'track-sports': 'Category/Sub-Category/Sports/Sports/sports-track-sports.html',
        'stick-sports': 'Category/Sub-Category/Sports/Sports/sports-stick-sports.html',
        'water-sports': 'Category/Sub-Category/Sports/Sports/sports-water-sports.html',
        'motor-sports': 'Category/Sub-Category/Sports/Sports/sports-motor-sports.html',
        'gymnastics': 'Category/Sub-Category/Sports/Sports/sports-gymnastics.html',
        'ice-sports': 'Category/Sub-Category/Sports/Sports/sports-ice-sports.html',
        'animal-sports': 'Category/Sub-Category/Sports/Sports/sports-animal-sports.html',
        'contact-team-sport': 'Category/Sub-Category/Sports/Sports/sports-contact-team-sport.html',
        'other-sports': 'Category/Sub-Category/Sports/Sports/sports-other-sports.html'
      };

      const target = routes[key];
      if (target) {
        localStorage.setItem('selectedSportCategory', key);
        window.location.href = target;
      }
    }

    renderCards();
  </script>
  <script src="profile-icon.js"></script>
</body>
</html>
