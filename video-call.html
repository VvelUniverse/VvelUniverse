<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vvel Universe | Video Call</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-100: #0b1a3a;
      --navy-200: #0f2a5a;
      --navy-300: #123571;
      --navy-400: #174ea6;
      --glass-bg: rgba(13, 31, 74, 0.26);
      --glass-blur: blur(18px);
      --glass-border: 1.4px solid rgba(23, 78, 166, 0.55);
      --font-title: 'Orbitron', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --font-body: 'Outfit', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .call-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      padding: 1rem;
      overflow: hidden;
      position: relative;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
      flex: 1;
      overflow: auto;
    }

    .video-container {
      position: relative;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16/9;
      border: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-container.local video {
      transform: scaleX(-1);
    }

    .video-label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
    }

    .video-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .video-placeholder-icon {
      font-size: 64px;
      opacity: 0.5;
    }

    .video-placeholder-text {
      font-size: 16px;
      font-weight: 600;
    }

    .status-indicator {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .status-indicator.muted {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }

    .status-indicator.video-off {
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    }

    .call-header {
      position: absolute;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .call-header > * {
      pointer-events: auto;
    }

    .call-info {
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .call-title {
      font-family: var(--font-title);
      font-size: 18px;
      font-weight: 700;
    }

    .call-time {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      font-variant-numeric: tabular-nums;
    }

    .participant-count {
      background: rgba(59, 130, 246, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .controls-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(2, 6, 23, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .controls-group {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .control-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: rgba(30, 41, 59, 0.8);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .control-btn:hover {
      background: rgba(51, 65, 85, 0.9);
      transform: scale(1.05);
    }

    .control-btn.active {
      background: rgba(59, 130, 246, 0.3);
      border: 2px solid rgba(59, 130, 246, 0.6);
    }

    .control-btn.muted {
      background: rgba(239, 68, 68, 0.3);
      border: 2px solid rgba(239, 68, 68, 0.6);
    }

    .control-btn.video-off {
      background: rgba(245, 158, 11, 0.3);
      border: 2px solid rgba(245, 158, 11, 0.6);
    }

    .control-btn svg {
      width: 24px;
      height: 24px;
    }

    .control-btn.end-call {
      width: auto;
      padding: 0 24px;
      border-radius: 28px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      font-weight: 700;
      font-size: 16px;
      gap: 8px;
    }

    .control-btn.end-call:hover {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      transform: scale(1.05);
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
    }

    @media (max-width: 768px) {
      .video-grid {
        grid-template-columns: 1fr;
      }

      .controls-group {
        gap: 0.5rem;
      }

      .control-btn {
        width: 48px;
        height: 48px;
      }

      .control-btn svg {
        width: 20px;
        height: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="call-container" id="callContainer">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div class="loading-text">Connecting...</div>
    </div>

    <div class="call-header">
      <div class="call-info">
        <div class="call-title" id="callTitle">Video Call</div>
        <div class="call-time" id="callTime">00:00</div>
        <div class="participant-count" id="participantCount">2 participants</div>
      </div>
    </div>

    <div class="video-grid" id="videoGrid">
      <div class="video-container local" id="localVideoContainer">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="video-label">
          <span>You</span>
          <div class="status-indicator" id="localStatus"></div>
        </div>
        <div class="video-placeholder" id="localPlaceholder" style="display: none;">
          <div class="video-placeholder-icon">👤</div>
          <div class="video-placeholder-text">Your Camera</div>
        </div>
      </div>

      <div class="video-container remote" id="remoteVideoContainer">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="video-label">
          <span id="remoteName">Connecting...</span>
          <div class="status-indicator" id="remoteStatus"></div>
        </div>
        <div class="video-placeholder" id="remotePlaceholder">
          <div class="video-placeholder-icon">⏳</div>
          <div class="video-placeholder-text">Waiting for connection...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls-bar">
    <div class="controls-group">
      <button class="control-btn" id="micBtn" title="Mute/Unmute">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <button class="control-btn" id="videoBtn" title="Turn Video On/Off">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 7l-7 5 7 5V7z"></path>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
      </button>

      <button class="control-btn end-call" id="endCallBtn" title="End Call">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        <span>End Call</span>
      </button>
    </div>
  </div>

  <script>
    // WebRTC Configuration
    const configuration = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    let localStream = null;
    let remoteStream = null;
    let peerConnection = null;
    let callStartTime = null;
    let callTimer = null;

    // State
    const state = {
      micEnabled: true,
      videoEnabled: true,
      isConnected: false
    };

    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const callId = urlParams.get('callId') || 'default-call';
    const remoteName = urlParams.get('name') || 'Influencer';
    const callType = urlParams.get('type') || 'video'; // 'video' or 'audio'

    // Initialize
    document.getElementById('remoteName').textContent = remoteName;
    document.getElementById('callTitle').textContent = `${remoteName} - ${callType === 'video' ? 'Video' : 'Audio'} Call`;

    // Initialize call
    async function initCall() {
      try {
        // Request media
        const constraints = {
          audio: true,
          video: callType === 'video' ? {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: 'user'
          } : false
        };

        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        
        // Display local video
        const localVideo = document.getElementById('localVideo');
        localVideo.srcObject = localStream;
        
        // Hide placeholder
        document.getElementById('localPlaceholder').style.display = 'none';
        
        // Update state
        state.videoEnabled = callType === 'video';
        updateControls();

        // Create peer connection
        peerConnection = new RTCPeerConnection(configuration);

        // Add local tracks
        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        // Handle remote stream
        peerConnection.ontrack = (event) => {
          remoteStream = event.streams[0];
          const remoteVideo = document.getElementById('remoteVideo');
          remoteVideo.srcObject = remoteStream;
          document.getElementById('remotePlaceholder').style.display = 'none';
          state.isConnected = true;
          hideLoading();
          startCallTimer();
        };

        // Handle ICE candidates
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            // In a real app, send this to the signaling server
            console.log('ICE candidate:', event.candidate);
          }
        };

        // Handle connection state
        peerConnection.onconnectionstatechange = () => {
          console.log('Connection state:', peerConnection.connectionState);
          if (peerConnection.connectionState === 'connected') {
            hideLoading();
            startCallTimer();
          } else if (peerConnection.connectionState === 'disconnected' || 
                     peerConnection.connectionState === 'failed') {
            showError('Connection lost. Attempting to reconnect...');
          }
        };

        // Simulate connection (in production, use signaling server)
        setTimeout(() => {
          simulateConnection();
        }, 2000);

      } catch (error) {
        console.error('Error initializing call:', error);
        showError('Failed to access camera/microphone. Please check permissions.');
      }
    }

    // Simulate connection (replace with actual signaling)
    function simulateConnection() {
      // In production, this would be handled by a signaling server
      // For now, we'll simulate a successful connection
      hideLoading();
      startCallTimer();
      
      // Simulate remote video after a delay
      setTimeout(() => {
        document.getElementById('remotePlaceholder').style.display = 'none';
        state.isConnected = true;
        updateRemoteStatus();
      }, 3000);
    }

    // Controls
    document.getElementById('micBtn').addEventListener('click', toggleMic);
    document.getElementById('videoBtn').addEventListener('click', toggleVideo);
    document.getElementById('endCallBtn').addEventListener('click', endCall);

    function toggleMic() {
      state.micEnabled = !state.micEnabled;
      if (localStream) {
        localStream.getAudioTracks().forEach(track => {
          track.enabled = state.micEnabled;
        });
      }
      updateControls();
    }

    function toggleVideo() {
      if (callType === 'audio') {
        alert('This is an audio-only call. Video is not available.');
        return;
      }

      state.videoEnabled = !state.videoEnabled;
      if (localStream) {
        localStream.getVideoTracks().forEach(track => {
          track.enabled = state.videoEnabled;
        });
      }

      const localVideo = document.getElementById('localVideo');
      const localPlaceholder = document.getElementById('localPlaceholder');
      
      if (state.videoEnabled) {
        localPlaceholder.style.display = 'none';
        localVideo.style.display = 'block';
      } else {
        localPlaceholder.style.display = 'flex';
        localVideo.style.display = 'none';
      }

      updateControls();
    }

    function endCall() {
      if (confirm('Are you sure you want to end the call?')) {
        stopCall();
        window.location.href = '/community.html';
      }
    }

    function stopCall() {
      if (callTimer) {
        clearInterval(callTimer);
      }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      if (peerConnection) {
        peerConnection.close();
      }
    }

    function updateControls() {
      const micBtn = document.getElementById('micBtn');
      const videoBtn = document.getElementById('videoBtn');
      const localStatus = document.getElementById('localStatus');

      // Update mic button
      if (state.micEnabled) {
        micBtn.classList.remove('muted');
        localStatus.classList.remove('muted');
      } else {
        micBtn.classList.add('muted');
        localStatus.classList.add('muted');
      }

      // Update video button
      if (state.videoEnabled) {
        videoBtn.classList.remove('video-off');
        localStatus.classList.remove('video-off');
      } else {
        videoBtn.classList.add('video-off');
        localStatus.classList.add('video-off');
      }
    }

    function updateRemoteStatus() {
      const remoteStatus = document.getElementById('remoteStatus');
      if (state.isConnected) {
        remoteStatus.style.background = '#22c55e';
      }
    }

    function startCallTimer() {
      callStartTime = Date.now();
      callTimer = setInterval(() => {
        const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
        const minutes = Math.floor(elapsed / 60);
        const seconds = elapsed % 60;
        document.getElementById('callTime').textContent = 
          `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }, 1000);
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    function showError(message) {
      const loadingText = document.querySelector('.loading-text');
      loadingText.textContent = message;
      loadingText.style.color = '#fca5a5';
    }

    // Handle page unload
    window.addEventListener('beforeunload', stopCall);

    // Initialize on load
    window.addEventListener('load', () => {
      initCall();
    });
  </script>
  <script src="swipe-navigation.js"></script>
</body>
</html>
